# Windows event identifiers referenced by plan telemetry. Each entry was checked against the
# linked Microsoft documentation. Add an entry here before using a new event in a plan.
events:
  - source: Sysmon
    event_id: 1
    channel: Microsoft-Windows-Sysmon/Operational
    name: Process creation
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Sysmon
    event_id: 3
    channel: Microsoft-Windows-Sysmon/Operational
    name: Network connection
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Sysmon
    event_id: 10
    channel: Microsoft-Windows-Sysmon/Operational
    name: ProcessAccess
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Sysmon
    event_id: 11
    channel: Microsoft-Windows-Sysmon/Operational
    name: FileCreate
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Sysmon
    event_id: 13
    channel: Microsoft-Windows-Sysmon/Operational
    name: RegistryEvent (Value Set)
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Sysmon
    event_id: 22
    channel: Microsoft-Windows-Sysmon/Operational
    name: DNSEvent (DNS query)
    reference: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - source: Security
    event_id: 1102
    channel: Security
    name: The audit log was cleared
    reference: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
  - source: Security
    event_id: 4688
    channel: Security
    name: A new process has been created
    prerequisite: Audit Process Creation; include command line in process creation events
    reference: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4688
  - source: Security
    event_id: 4698
    channel: Security
    name: A scheduled task was created
    prerequisite: Audit Other Object Access Events
    reference: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
  - source: PowerShell
    event_id: 4104
    channel: Microsoft-Windows-PowerShell/Operational
    name: Script block logging
    prerequisite: Script Block Logging enabled (PowerShell 7 uses PowerShellCore/Operational)
    reference: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows
