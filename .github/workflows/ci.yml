name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, validate, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Lint YAML
        run: yamllint -s .

      - name: Lint Markdown
        run: pymarkdown --config .pymarkdown.json scan -r --exclude .github --exclude tests/fixtures .

      - name: Validate plans
        run: python tools/validate_plans.py

      - name: Check coverage matrix
        run: python tools/render_coverage.py --check

      - name: Run tests
        run: pytest --cov=tools --cov-report=term-missing --cov-fail-under=80
